<!DOCTYPE html>
<html>
<head>
    <title>Task 2 - Contact Form & To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>ApexPlanet Task 2</h1>

    <div class="container">

        <!-- Contact Form -->
        <div class="form-section">
            <h2>Contact Form</h2>

            <form id="contactForm">

                <input type="text"
                       id="name"
                       placeholder="Enter Name">

                <input type="email"
                       id="email"
                       placeholder="Enter Email">

                <textarea id="message"
                          placeholder="Enter Message"></textarea>

                <button type="submit">
                    Submit
                </button>

            </form>

            <p id="error"></p>

        </div>

        <!-- To-Do List -->
        <div class="todo-section">

            <h2>To-Do List</h2>

            <input type="text"
                   id="taskInput"
                   placeholder="Enter Task">

            <button onclick="addTask()">
                Add Task
            </button>

            <ul id="taskList"></ul>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
